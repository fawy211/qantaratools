name: Localized SEO QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/complete-multilingual-support
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: localized-seo-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localized-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/seo-locales.js
          node --check scripts/validate-localized-seo.js
          node --check scripts/generate-tool-pages.js
          node --check scripts/generate-localized-tool-pages.js
          node --check scripts/validate-localized-pages.js
          node --check scripts/prepare-vendor-assets.js
      - name: Validate complete localized SEO records
        run: npm run i18n:seo:check
      - name: Regenerate English and localized tool pages
        run: |
          node scripts/generate-tool-pages.js
          node scripts/generate-localized-tool-pages.js
          node scripts/validate-localized-pages.js
      - name: Verify localized page output
        run: |
          test "$(find de/tools -name index.html | wc -l)" -eq 50
          test "$(find fr/tools -name index.html | wc -l)" -eq 50
          test "$(find es/tools -name index.html | wc -l)" -eq 50
          grep -q 'hreflang="de"' tools/base64/index.html
          grep -q '/de/tools/base64/' sitemap.xml
      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build local Tailwind CSS\n        run: npm run build:css\n      - name: Verify compiled Tailwind stylesheet\n        run: test -s assets/css/tailwind-local.css\n      - name: Test local-first Tailwind and CDN fallback\n        run: npx playwright test tests/tailwind-local.spec.js --project=chromium --workers=1\n      - name: Prepare pinned local helper assets
        run: node scripts/prepare-vendor-assets.js
      - name: Verify prepared local vendor assets
        run: |
          test -s assets/vendor/fontawesome/6.4.0/css/all.min.css
          test -s assets/vendor/fontawesome/6.4.0/LICENSE
          test -n "$(find assets/vendor/fontawesome/6.4.0/webfonts -type f | grep -E '\.(woff2?|ttf|otf)$')"
          test -s assets/vendor/pdf-lib/1.17.1/pdf-lib.min.js
          test -s assets/vendor/jspdf/2.5.1/jspdf.umd.min.js
          test -s assets/vendor/qrcodejs/1.0.0/qrcode.min.js
          test -s assets/vendor/exif-js/2.3.0/exif.js
      - name: Test all localized tool pages in small Chromium batches
        run: npx playwright test tests/tool-load.spec.js --project=chromium --workers=2
      - name: Test localized homepage and tool functionality
        run: npx playwright test tests/localized-pages.spec.js --project=chromium --workers=2
      - name: Test local-first tools with external network blocked
        run: npx playwright test tests/offline-smoke.spec.js --project=chromium --workers=1
      - name: Commit generated localized pages to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/complete-multilingual-support'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de fr es tools sitemap.xml assets/vendor assets/fonts assets/css/tailwind-local.css
          if ! git diff --cached --quiet; then
            git commit -m "Generate localized SEO landing pages"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin "$GITHUB_REF_NAME"
                git rebase "origin/$GITHUB_REF_NAME"
              fi
            done
            echo "Could not push generated pages after 3 safe attempts."
            exit 1
          fi
